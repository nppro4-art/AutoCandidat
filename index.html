<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoCandidat — Ton espace de candidature</title>
<meta name="description" content="AutoCandidat aide à organiser et préparer ses candidatures.">
<style>
:root{--bg:#070707;--panel:#101010;--panel2:#151515;--line:#272727;--text:#f5f5f5;--muted:#909090;--green:#76df91}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.015em}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:0 22px}
nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,7,7,.88);backdrop-filter:blur(18px);z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-weight:800}.logo{width:30px;height:30px;border-radius:9px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900}.navlinks{display:flex;gap:24px;color:#999;font-size:13px}.navlinks button{background:none;border:0;color:inherit}
.account{display:flex;gap:8px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;border:1px solid #333;background:#171717;color:#fff;font-weight:800}.navcta,.primary{background:#fff;color:#000;border:0;border-radius:11px;padding:11px 16px;font-weight:800}.secondary{background:#151515;color:#eee;border:1px solid #303030;border-radius:11px;padding:11px 16px;font-weight:700}
.page{padding:70px 0}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center}.eyebrow{color:#999;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;margin-bottom:16px}.hero h1{font-size:clamp(46px,6vw,76px);line-height:.96;letter-spacing:-.06em;margin:0 0 22px}.hero h1 span{color:#707070}.hero p{font-size:18px;line-height:1.55;color:#aaa;max-width:610px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}
.preview{background:linear-gradient(145deg,#171717,#0d0d0d);border:1px solid #292929;border-radius:24px;padding:18px;box-shadow:0 25px 80px #000}.preview-head{display:flex;justify-content:space-between;color:#777;font-size:11px;margin-bottom:15px}.preview-row{padding:15px;border:1px solid #282828;border-radius:14px;background:#111;margin:8px 0}.preview-row b{font-size:13px}.preview-row small{display:block;color:#777;margin-top:5px}.status{float:right;color:var(--green);font-size:10px}
.section{padding:65px 0}.section h2{font-size:34px;letter-spacing:-.045em;margin:0 0 10px}.intro{color:#888;line-height:1.6;max-width:680px;margin-bottom:28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:18px;background:#0d0d0d;padding:21px}.card h3{margin:22px 0 8px}.card p{color:#888;font-size:13px;line-height:1.55;margin:0}
#app,#profile{display:none;padding:38px 0 90px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.head h2{margin:0;font-size:31px}.head p{color:#888;margin:7px 0 0}.progress{height:5px;background:#1b1b1b;border-radius:8px;overflow:hidden;margin-bottom:25px}.progress i{display:block;height:100%;width:25%;background:#fff;transition:.25s}
.form-card,.profile-card{background:#0d0d0d;border:1px solid var(--line);border-radius:20px;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:15px}.field label{display:block;font-size:12px;color:#999;margin-bottom:7px}.field input,.field select{width:100%;background:#151515;color:#fff;border:1px solid #2c2c2c;border-radius:10px;padding:12px;outline:none}.field input:focus,.field select:focus{border-color:#666}.wide{grid-column:1/-1}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choices button{background:#151515;color:#aaa;border:1px solid #2b2b2b;border-radius:10px;padding:12px}.choices button.active{background:#fff;color:#000;border-color:#fff;font-weight:800}
.footerbar{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.hint{font-size:12px;color:#666}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.stat{border:1px solid var(--line);border-radius:14px;background:#0d0d0d;padding:15px}.stat b{display:block;font-size:22px}.stat span{color:#777;font-size:11px}.company{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border:1px solid #252525;background:#101010;border-radius:14px;padding:14px;margin-bottom:8px}.company h3{margin:0;font-size:14px}.company p{margin:4px 0 0;color:#777;font-size:12px}.company input{width:19px;height:19px;accent-color:#fff}.match{color:var(--green);font-size:11px}
.profile-top{display:flex;align-items:center;gap:18px;margin-bottom:25px}.big-avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;font-size:24px;font-weight:900}.profile-top h2{margin:0}.profile-top p{margin:5px 0 0;color:#888}.profile-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#000;padding:12px 15px;border-radius:12px;font-size:12px;font-weight:800;transform:translateY(100px);opacity:0;transition:.25s;z-index:60}.toast.show{transform:none;opacity:1}
.hidden{display:none!important}
@media(max-width:800px){.hero{grid-template-columns:1fr}.preview{display:none}.cards{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.choices{grid-template-columns:1fr 1fr}.navlinks{display:none}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.shell{padding:0 15px}.page{padding:45px 0}.hero h1{font-size:49px}.choices{grid-template-columns:1fr}.head{display:block}.footerbar{display:block}.footerbar button{margin-top:12px}}
.upload-zone{border:1px dashed #383838;border-radius:16px;padding:20px;text-align:center;background:#0b0b0b}.upload-zone input{display:none}.upload-zone label{display:inline-block;background:#fff;color:#000;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.doc{margin-top:10px;padding:10px;border:1px solid #272727;border-radius:10px;font-size:12px}.doc small{display:block;color:#777;margin-top:4px}.company-search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.company-search input{background:#151515;color:#fff;border:1px solid #2c2c2c;border-radius:10px;padding:11px}.result-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #272727;border-radius:12px;padding:12px;margin-bottom:7px}.result-card h3{margin:0;font-size:13px}.result-card p{margin:4px 0 0;color:#777;font-size:11px}.ai-status{color:#888;font-size:12px;margin-top:10px}
</head>
<body>
<div class="shell">
<nav>
<div class="brand"><span class="logo">A</span> AutoCandidat</div>
<div class="navlinks"><button onclick="showHome()">Accueil</button><button onclick="showProfile()">Mon profil</button><button onclick="showApp()">Mes candidatures</button></div>
<div class="account"><button class="avatar" onclick="showProfile()" id="navAvatar">?</button></div>
</nav>

<main id="home" class="page">
<section class="hero">
<div>
<div class="eyebrow">Stage · Alternance · Emploi</div>
<h1>Ta recherche d'emploi.<br><span>Dans un seul espace.</span></h1>
<p>Renseigne ton profil une seule fois. AutoCandidat conserve tes informations localement et t'aide à préparer tes candidatures sans dépendre d'une base de données externe.</p>
<div class="actions"><button class="primary" onclick="startQuestionnaire()">Commencer →</button><button class="secondary" onclick="showProfile()">Mon profil</button></div>
</div>
<div class="preview">
<div class="preview-head"><span>TON ESPACE</span><span>LOCAL · PRIVÉ</span></div>
<div class="preview-row"><span class="status">● enregistré</span><b>Profil candidat</b><small>Formation · niveau · ville · mobilité</small></div>
<div class="preview-row"><span class="status">● prêt</span><b>Questionnaire simplifié</b><small>6 informations, pas de formulaire interminable</small></div>
<div class="preview-row"><span class="status">● local</span><b>Données sur ton appareil</b><small>Pas besoin de Supabase pour commencer</small></div>
</div>
</section>

<section class="section">
<h2>Un compte sans infrastructure inutile.</h2>
<p class="intro">Pour la version personnelle, le profil est enregistré dans le navigateur. Un cookie local identifie simplement la session ; les données restent sur ton appareil. Tu peux utiliser AutoCandidat gratuitement sans créer de compte serveur.</p>
<div class="cards">
<div class="card"><b>01</b><h3>Ton profil</h3><p>Une page dédiée pour modifier tes informations à tout moment.</p></div>
<div class="card"><b>02</b><h3>Ta recherche</h3><p>Un questionnaire court avec uniquement les critères réellement utiles.</p></div>
<div class="card"><b>03</b><h3>Tes candidatures</h3><p>Les sélections et l'état de tes candidatures restent disponibles sur ton appareil.</p></div>
</div>
</section>
</main>

<section id="profile">
<div class="head"><div><div class="eyebrow">Espace personnel</div><h2>Mon profil</h2><p>Tes informations sont enregistrées localement dans ce navigateur.</p></div><button class="secondary" onclick="showHome()">Accueil</button></div>
<div class="profile-card">
<div class="profile-top"><div class="big-avatar" id="profileAvatar">?</div><div><h2 id="profileName">Mon profil</h2><p id="profileSummary">Complète ton profil pour commencer.</p></div></div>
<div class="grid">
<div class="field"><label>Formation</label><input id="pFormation" placeholder="Ex. CAP Cuisine, BTS Commerce, Bac Pro Métiers du numérique"></div>
<div class="field"><label>Niveau de classe</label><input id="pLevel" placeholder="Ex. Seconde, Première, Terminale, Bac+1"></div>
<div class="field"><label>Ville</label><input id="pCity" placeholder="Ex. Toulouse, Lille, Lyon, Strasbourg"></div>
<div class="field"><label>Type d'emploi recherché</label><select id="pType"><option>Stage</option><option>Alternance</option><option>Premier emploi</option></select></div>
<div class="field"><label>Temps de trajet maximum</label><select id="pTravel"><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 h</option><option value="90">1 h 30</option></select></div><div class="field wide"><label>Moyen de transport</label><div class="choices" id="pTransport"><button data-v="Voiture">🚗 Voiture</button><button data-v="Bus">🚌 Bus</button><button data-v="Vélo">🚲 Vélo</button><button data-v="À pied">🚶 À pied</button></div></div>
</div>
<div class="profile-actions"><button class="secondary" onclick="resetProfile()">Effacer les données locales</button><button class="primary" onclick="saveProfile()">Enregistrer le profil</button></div><div class="section" style="padding:32px 0 0"><h2 style="font-size:22px">CV et lettre de motivation</h2><p class="intro">Tu peux importer un CV ou une lettre même s’ils sont mal organisés. Il faut simplement qu’ils contiennent toutes les informations utiles. L’IA s’occupe ensuite de les remettre en ordre. Si tu n’as aucun document, remplis les champs manuels.</p><div class="grid"><div class="upload-zone"><b>Importer ton CV</b><p class="hint">PDF, DOCX ou TXT</p><label for="cvFile">Choisir un CV</label><input id="cvFile" type="file" accept=".pdf,.docx,.txt" onchange="readDocument(this,'cv')"><div id="cvDoc"></div></div><div class="upload-zone"><b>Importer ta lettre</b><p class="hint">PDF, DOCX ou TXT</p><label for="letterFile">Choisir une lettre</label><input id="letterFile" type="file" accept=".pdf,.docx,.txt" onchange="readDocument(this,'letter')"><div id="letterDoc"></div></div></div><div class="ai-status" id="aiStatus">IA : prête. Les documents restent locaux jusqu’à l’analyse.</div><div class="profile-actions"><button class="primary" onclick="analyzeDocuments()">✨ Analyser et restructurer</button></div><div class="profile-actions"><button class="secondary" onclick="generateAI('generate_cv')">Créer mon CV avec l’IA</button><button class="secondary" onclick="generateAI('generate_letter')">Créer ma lettre avec l’IA</button></div><div id="aiOutput" class="doc"></div></div><div class="section" style="padding:25px 0 0"><h2 style="font-size:22px">Créer sans CV ni lettre</h2><div class="field"><label>Informations personnelles</label><textarea id="manualPersonal" rows="3" placeholder="Nom, prénom, téléphone, email, ville, permis, mobilité, liens..."></textarea></div><div class="field"><label>Formation et diplômes</label><textarea id="manualEducation" rows="4" placeholder="Écoles, diplômes, années, spécialités, projets..."></textarea></div><div class="field"><label>Expériences et compétences</label><textarea id="manualExperience" rows="5" placeholder="Stages, emplois, missions, logiciels, langues, compétences..."></textarea></div><div class="field"><label>Informations complémentaires</label><textarea id="manualExtra" rows="4" placeholder="Disponibilités, objectifs, centres d’intérêt, autres informations..."></textarea></div><div class="profile-actions"><button class="primary" onclick="saveManualDocs()">Enregistrer les informations</button></div></div>
</div>
</section>

<section id="app">
<div class="head"><div><div class="eyebrow">Nouvelle recherche</div><h2 id="appTitle">Ton questionnaire</h2><p id="appSub">Six informations. C'est tout.</p></div><button class="secondary" onclick="showHome()">← Accueil</button></div>
<div class="progress"><i id="bar"></i></div>

<div id="q1" class="form-card">
<div class="grid">
<div class="field"><label>Formation</label><input id="qFormation" placeholder="Ex. BTS Tourisme, Bac Pro Commerce, CAP Cuisine"></div>
<div class="field"><label>Niveau de classe</label><input id="qLevel" placeholder="Ex. Seconde, Première, Terminale, Bac+2"></div>
<div class="field"><label>Ville</label><input id="qCity" placeholder="Ex. Nantes, Bordeaux, Marseille, Rennes"></div>
<div class="field"><label>Type d'emploi recherché</label><select id="qType"><option>Stage</option><option>Alternance</option><option>Premier emploi</option></select></div>
<div class="field"><label>Temps de trajet maximum</label><select id="qTravel"><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">1 h</option><option value="90">1 h 30</option></select></div><div class="field wide"><label>Moyen de transport</label><div class="choices" id="qTransport"><button data-v="Voiture">🚗 Voiture</button><button data-v="Bus">🚌 Bus</button><button data-v="Vélo">🚲 Vélo</button><button data-v="À pied">🚶 À pied</button></div></div>
</div>
<div class="footerbar"><span class="hint">Aucune connexion à Supabase nécessaire.</span><button class="primary" onclick="saveQuestionnaire()">Voir les opportunités →</button></div>
</div>

<div id="q2" class="hidden">
<div class="stats"><div class="stat"><b id="resultCount">0</b><span>entreprises enregistrées</span></div><div class="stat"><b id="profileMatch">100%</b><span>profil renseigné</span></div><div class="stat"><b>LOCAL</b><span>données navigateur</span></div></div>
<div class="form-card"><div class="company-search"><input id="companySearch" placeholder="Ex. bureau d’études, boulangerie, restaurant, agence"><button class="primary" onclick="searchCompanies()">Rechercher</button></div><div id="searchResults"></div><div class="add-company"><input id="newCompanyName" placeholder="Nom de l’entreprise"><input id="newCompanyCity" placeholder="Ville"><input id="newCompanyEmail" placeholder="Email de candidature (optionnel)"><button class="primary" onclick="addCompany()">+ Ajouter</button></div><div id="companyList"></div><div class="footerbar"><button class="secondary" onclick="setQuestionStep(1)">← Modifier</button><button class="primary" onclick="saveSelection()">Enregistrer ma sélection</button></div></div>
</div>
</section>

<footer style="border-top:1px solid var(--line);padding:28px 0;color:#666;font-size:12px"><div>© 2026 AutoCandidat · Mode personnel gratuit</div></footer>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='autocandidat_local_v3';
let data=load();
let transport=data.transport||'Voiture';
let selected=new Set(data.selected||[]);
function ensureSession(){if(!document.cookie.includes('autocandidat_session='))document.cookie='autocandidat_session=local; max-age=31536000; path=/; SameSite=Lax'}
ensureSession();

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Object.assign({companies:[],applications:[]},x||{})}catch(e){return {companies:[],applications:[]}}}
function persist(){data.transport=transport;data.selected=[...selected];data.companies=data.companies||[];data.applications=data.applications||[];localStorage.setItem(KEY,JSON.stringify(data))}
function initials(){const f=(data.formation||'').trim();return f?f[0].toUpperCase():'?'}
function searchCompanies(){const q=companySearch.value.trim();if(!q){toast('Indique une activité ou un type d’entreprise.');return}searchResults.innerHTML='<div class="hint">Recherche...</div>';fetch('/api/companies?q='+encodeURIComponent(q)).then(r=>r.json()).then(j=>{window._companyResults=j.results||[];searchResults.innerHTML=window._companyResults.map((c,i)=>'<div class="result-card"><div><h3>'+escapeHtml(c.name)+'</h3><p>'+escapeHtml(c.city)+' · '+escapeHtml(c.siren)+' · '+escapeHtml(c.activity)+'</p></div><button class="secondary" onclick="importCompany('+i+')">+ Ajouter</button></div>').join('')||'<div class="hint">Aucun résultat.</div>'}).catch(()=>{searchResults.innerHTML='<div class="hint">Recherche indisponible.</div>'})}
function importCompany(i){const c=window._companyResults[i];data.companies=data.companies||[];if(!data.companies.some(x=>x.siren===c.siren)){data.companies.push(c);persist();renderCompanies();toast('Entreprise ajoutée.')}}
function escapeHtml(v){return String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function generateAI(action){const profile=data.aiProfile||data;const manual=data.manual||{};aiStatus.textContent='IA : génération en cours...';try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,profile,documents:data.documents||{},manual})});const j=await r.json();if(!r.ok)throw new Error();data.generated=data.generated||{};data.generated[action]=j.result;persist();aiOutput.innerHTML='<pre style="white-space:pre-wrap;color:#ddd;line-height:1.5">'+escapeHtml(JSON.stringify(j.result,null,2))+'</pre>';aiStatus.textContent='IA : génération terminée.';toast('Document généré.')}catch(e){aiStatus.textContent='IA : ajoute GEMINI_API_KEY dans Vercel.';toast('IA non configurée.')}}
function saveManualDocs(){data.manual={personal:manualPersonal.value,education:manualEducation.value,experience:manualExperience.value,extra:manualExtra.value};persist();toast('Informations enregistrées localement.')}
async function analyzeDocuments(){const docs=data.documents||{};const manual=data.manual||{};if(!docs.cv&&!docs.letter&&!Object.values(manual).some(Boolean)){toast('Importe un document ou remplis les champs.');return}aiStatus.textContent='IA : analyse en cours...';try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'structure_profile',profile:data,documents:docs,manual})});const j=await r.json();if(!r.ok)throw new Error();data.aiProfile=j.result;persist();aiStatus.textContent='IA : profil restructuré et enregistré localement.';toast('Analyse terminée.')}catch(e){aiStatus.textContent='IA : ajoute GEMINI_API_KEY dans Vercel pour activer l’analyse.';toast('IA non configurée.')}}
async function readDocument(input,type){const file=input.files[0];if(!file)return;const target=type==='cv'?cvDoc:letterDoc;try{let text='';if(file.name.toLowerCase().endsWith('.txt'))text=await file.text();else if(file.name.toLowerCase().endsWith('.docx')){await loadScript('https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js');const out=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});text=out.value}else if(file.name.toLowerCase().endsWith('.pdf')){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();text+=tc.items.map(x=>x.str).join(' ')+'\n'}}else throw new Error();data.documents=data.documents||{};data.documents[type]={name:file.name,text};persist();target.innerHTML='<div class="doc">'+escapeHtml(file.name)+'<small>'+text.length+' caractères extraits</small></div>';aiStatus.textContent='Document chargé localement.'}catch(e){target.innerHTML='<div class="doc">Lecture impossible</div>';toast('Format non lisible.')}}
function loadScript(src){return new Promise((resolve,reject)=>{const x=document.createElement('script');x.src=src;x.onload=resolve;x.onerror=reject;document.head.appendChild(x)})}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function setTransport(rootId,current){document.querySelectorAll('#'+rootId+' button').forEach(b=>{b.classList.toggle('active',b.dataset.v===current);b.onclick=()=>{document.querySelectorAll('#'+rootId+' button').forEach(x=>x.classList.remove('active'));b.classList.add('active');transport=b.dataset.v}})}
function showHome(){['profile','app'].forEach(x=>document.getElementById(x).style.display='none');document.getElementById('home').style.display='block';window.scrollTo(0,0)}
function showProfile(){document.getElementById('home').style.display='none';document.getElementById('app').style.display='none';document.getElementById('profile').style.display='block';fillProfile();window.scrollTo(0,0)}
function showApp(){document.getElementById('home').style.display='none';document.getElementById('profile').style.display='none';document.getElementById('app').style.display='block';fillQuestionnaire();setQuestionStep(1);window.scrollTo(0,0)}
function startQuestionnaire(){showApp()}
function fillProfile(){pFormation.value=data.formation||'';pLevel.value=data.level||'';pCity.value=data.city||'';pType.value=data.type||'Stage';pTravel.value=data.travel||'30';setTransport('pTransport',data.transport||'Voiture');profileAvatar.textContent=initials();profileName.textContent=data.formation||'Mon profil';profileSummary.textContent=[data.level,data.city,data.type].filter(Boolean).join(' · ')||'Complète ton profil pour commencer.';navAvatar.textContent=initials()}
function saveProfile(){data.formation=pFormation.value.trim();data.level=pLevel.value.trim();data.city=pCity.value.trim();data.type=pType.value;data.travel=pTravel.value;data.transport=transport;persist();fillProfile();toast('Profil enregistré sur cet appareil.')}
function resetProfile(){localStorage.removeItem(KEY);data={};transport='Voiture';selected.clear();fillProfile();setTransport('pTransport','Voiture');toast('Données locales effacées.')}
function fillQuestionnaire(){qFormation.value=data.formation||'';qLevel.value=data.level||'';qCity.value=data.city||'';qType.value=data.type||'Stage';qTravel.value=data.travel||'30';setTransport('qTransport',data.transport||'Voiture')}
function saveQuestionnaire(){if(!qFormation.value.trim()||!qLevel.value.trim()||!qCity.value.trim()){toast('Remplis les 3 informations obligatoires.');return}data.formation=qFormation.value.trim();data.level=qLevel.value.trim();data.city=qCity.value.trim();data.type=qType.value;data.travel=qTravel.value;data.transport=transport;persist();renderCompanies();setQuestionStep(2)}
function setQuestionStep(n){q1.classList.toggle('hidden',n!==1);q2.classList.toggle('hidden',n!==2);bar.style.width=(n===1?'50%':'100%');appTitle.textContent=n===1?'Ton questionnaire':'Les entreprises';appSub.textContent=n===1?'Formation, ville, trajet et mobilité.':'Aucune entreprise fictive : ajoute tes vraies cibles.'}
function renderCompanies(){const companies=data.companies||[];if(!companies.length){companyList.innerHTML='<div style="padding:28px;text-align:center;border:1px dashed #303030;border-radius:14px;color:#777">Aucune entreprise enregistrée.<br><small>Ajoute une entreprise réelle pour activer « Postuler ».</small></div>';resultCount.textContent='0';return}const html=companies.map((c,i)=>{const app=(data.applications||[]).find(a=>a.companyId===c.id);const status=app?app.status:'À contacter';return '<div class="company"><input type="checkbox" '+(selected.has(c.id)?'checked':'')+' onchange="toggleCompany('+i+')"><div><h3>'+escapeHtml(c.name)+'</h3><p>'+escapeHtml(c.city||'Ville non renseignée')+' · '+(c.email?escapeHtml(c.email):'email non renseigné')+'</p></div><div class="company-actions"><select class="status-select" onchange="setApplicationStatus('+i+',this.value)"><option '+(status==='À contacter'?'selected':'')+'>À contacter</option><option '+(status==='Candidature préparée'?'selected':'')+'>Candidature préparée</option><option '+(status==='Envoyée'?'selected':'')+'>Envoyée</option><option '+(status==='Réponse reçue'?'selected':'')+'>Réponse reçue</option></select><button class="secondary" onclick="applyTo('+i+')">Postuler</button></div></div>'}).join('');companyList.innerHTML=html;resultCount.textContent=companies.length}
function escapeHtml(v){return String(v||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function addCompany(){const name=newCompanyName.value.trim(),city=newCompanyCity.value.trim(),email=newCompanyEmail.value.trim();if(!name||!city){toast('Nom et ville sont obligatoires.');return}const c={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),name,city,email};data.companies=data.companies||[];data.companies.push(c);persist();newCompanyName.value='';newCompanyCity.value='';newCompanyEmail.value='';renderCompanies();toast('Entreprise ajoutée.')}
function toggleCompany(i){const k=data.companies[i].id;selected.has(k)?selected.delete(k):selected.add(k);persist()}
function setApplicationStatus(i,status){const c=data.companies[i];data.applications=data.applications||[];let a=data.applications.find(x=>x.companyId===c.id);if(!a){a={companyId:c.id,status};data.applications.push(a)}else a.status=status;persist();toast('Suivi mis à jour.')}
function applyTo(i){const c=data.companies[i];if(!c.email){toast('Aucun email renseigné pour cette entreprise.');return}const subject=encodeURIComponent((data.type||'Candidature')+' — '+(data.formation||''));const body=encodeURIComponent('Bonjour,\n\nJe souhaite vous proposer ma candidature pour un '+(data.type||'poste')+'.\n\nFormation : '+(data.formation||'')+'\nNiveau : '+(data.level||'')+'\nVille : '+(data.city||'')+'\nMobilité : '+(data.transport||'')+'\nTemps de trajet maximum : '+(data.travel||'30')+' minutes\n\nCordialement.');window.location.href='mailto:'+encodeURIComponent(c.email)+'?subject='+subject+'&body='+body;setApplicationStatus(i,'Candidature préparée')}
function saveSelection(){persist();toast(selected.size+' entreprise(s) sélectionnée(s) localement.')}
setTransport('qTransport',transport);setTransport('pTransport',transport);fillProfile();navAvatar.textContent=initials();renderCompanies();
</script>
